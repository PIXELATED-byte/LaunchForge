<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LaunchForge</title>
<style>
:root{--bg:#0d0b14;--panel:#171422;--panel2:#1f1b2e;--line:#2c2740;--text:#ece9f6;--mute:#9c96b4;--v:#8b5cf6;--v2:#6d3fe0;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 "Segoe UI",system-ui,sans-serif}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(13,11,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;align-items:center;gap:20px;height:60px}
.logo{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--v),#c4b5fd);display:inline-block}
.links{display:flex;gap:18px;margin-left:auto;align-items:center;color:var(--mute)}
.links a,.links button.l{background:none;border:0;cursor:pointer;color:var(--mute);padding:4px}

.btn:hover{background:var(--v2)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.btn.ghost:hover{background:var(--panel2)}
.btn.danger{background:#b91c1c}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.sm{padding:6px 12px;font-size:14px}
.hero{padding:84px 0 40px;text-align:center}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.08;margin:0 0 18px;letter-spacing:-.02em}

.mock{margin:48px auto 0;max-width:900px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;box-shadow:0 20px 50px rgba(0,0,0,.4)}

.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.card h3{margin:0 0 6px;font-size:18px}.card p{margin:0;color:var(--mute)}
.plan.hl{border-color:var(--v)}.plan .price{font-size:28px;font-weight:700;margin:6px 0}.plan ul{padding-left:18px;color:var(--mute);margin:12px 0}
.note{font-size:13px;color:var(--mute)}

footer{border-top:1px solid var(--line);padding:32px 0;color:var(--mute)}footer .wrap{display:flex;gap:20px;flex-wrap:wrap;align-items:center}footer .sp{margin-left:auto}

.bar2 input{flex:1;min-width:180px;width:auto}.bar2 select{width:auto}

.f label{display:block;font-size:14px;color:var(--mute);margin:14px 0 5px}.f .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.info{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--mute);margin-top:14px}
.info b{color:var(--text)}
@media(max-width:860px){.ws{grid-template-columns:1fr}.mgrid{grid-template-columns:1fr}.links .hide{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ai{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;color:var(--mute);cursor:pointer}.chip:hover{color:var(--text);border-color:var(--v)}
.msg{margin-top:10px;padding:9px 12px;border-radius:10px;font-size:14px;background:var(--panel2)}.msg.ok{color:var(--ok)}.msg.err{color:var(--err)}
.hist{margin:0;padding-left:18px;font-size:14px;color:var(--mute)}
</style></head><body>
<nav class="top"><div class="wrap"><a class="logo" href="#/"><i></i>LaunchForge</a>
<div class="links"><button class="l hide" data-s="features">Features</button><button class="l hide" data-s="pricing">Pricing</button><button class="l hide" data-s="faq">FAQ</button><a href="#/about" class="hide">About</a><a href="#/contact" class="hide">Contact</a><a class="btn sm" href="#/dashboard">Dashboard</a><span id="authnav" style="display:flex;gap:10px;align-items:center"></span></div></div></nav>
<main id="app"></main>
<footer><div class="wrap"><span class="logo"><i></i>LaunchForge</span><a href="#/about">About</a><a href="#/contact">Contact</a><a href="#/privacy">Privacy</a><a href="#/terms">Terms</a><span class="sp note">From idea to online business.</span></div></footer>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app'), KEY='launchforge.projects.v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let draft=null, aiConfigured=false, aiStatus='checking', aiBusy=false;
const apiBase=()=>(localStorage.getItem('launchforge.apiBase')||window.LAUNCHFORGE_API_BASE||(location.protocol==='file:'?'http:'+'//localhost:3000':(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?'':'https:'+'//launchforge-4a6u.onrender.com'))).replace(/\/+$/,'');
const NAVJS='<script>document.addEventListener("click",function(ev){var a=ev.target.closest&&ev.target.closest("a");if(!a)return;var h=a.getAttribute("href")||"";ev.preventDefault();if(h.charAt(0)==="#"){var el=document.getElementById(h.slice(1));if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}});<\/script>';
addEventListener('beforeunload',e=>{if((draft&&!draft.saved)||[saver,lastSaver].some(x=>x&&x.isPending())){e.preventDefault();e.returnValue=''}});
/* ---------- storage (browser localStorage prototype) ---------- */
function load(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a.filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string'):[]}catch(e){return []}}
function save(l){try{localStorage.setItem(KEY,JSON.stringify(l));return true}catch(e){toast('Could not save: browser storage is unavailable.');return false}}
const get=id=>load().find(p=>p.id===id);
function toast(m){const t=$('#toast');t.innerHTML='<div class="toast">'+esc(m)+'</div>';setTimeout(()=>t.innerHTML='',2600)}
const fmt=t=>t?new Date(t).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'-';
/* ---------- server storage (backend + Neon Postgres) ---------- */
const OKEY='launchforge.owner.v1';
let saver=null,lastSaver=null;
const auth={state:'unknown',user:null,csrf:null,next:null,reason:''};   // state: unknown | in | out
const uk=k=>(auth.user?auth.user.id:'anon')+':'+k;   // recovery copies are kept per account
const srv={state:'unknown',msg:'',at:0}; // state: unknown | ready | unconfigured | down
const ISUUID=s=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s);
// Pre-accounts token (Stage 1). Never created any more; read only so old projects can be claimed after login.
function legacyToken(){try{const t=localStorage.getItem(OKEY);return /^[A-Za-z0-9_-]{32,128}$/.test(t||'')?t:null}catch(e){return null}}
async function apiRaw(method,path,body,timeout){
 const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout||20000);
 try{
  const r=await fetch(apiBase()+path,{method,credentials:'include',headers:Object.assign(method!=='GET'&&auth.csrf?{'X-CSRF-Token':auth.csrf}:{},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined,signal:c.signal});
  let j=null;if(r.status!==204){try{j=await r.json()}catch(e){}}
  if(!r.ok){const e=new Error((j&&j.error&&j.error.message)||'Server error ('+r.status+')');e.status=r.status;e.code=j&&j.error&&j.error.code;e.data=j;e.fatal=r.status>=400&&r.status<500&&r.status!==408&&r.status!==429;throw e}
  return j;
 }catch(e){if(e.status)throw e;const n=new Error(e.name==='AbortError'?'The server took too long to respond (it may be waking up).':'Could not reach the server.');n.network=true;throw n}
 finally{clearTimeout(t)}}
function markOut(){auth.state='out';auth.user=null;auth.csrf=null;if(/^#\/(project|new)/.test(location.hash))auth.next=location.hash;renderAuthNav()}
// Every call sends the session cookie (credentials) and the CSRF token. An expired session is reported, never hidden.
let csrfRetry=false;
async function api(method,path,body,timeout){
 try{return await apiRaw(method,path,body,timeout)}
 catch(e){
  if(e.status===403&&e.code==='CSRF_INVALID'&&!csrfRetry){csrfRetry=true;try{await checkAuth(true);if(auth.state==='in')return await apiRaw(method,path,body,timeout)}finally{csrfRetry=false}}
  if(e.status===401&&e.code==='AUTH_REQUIRED'){markOut();auth.reason='Your session expired. Log in again.';e.auth=true;e.message='Your session expired. Log in again.'}
  throw e}}
async function checkAuth(force){
 if(!force&&auth.state!=='unknown')return;
 try{const j=await apiRaw('GET','/api/auth/me');if(j&&j.user){auth.state='in';auth.user=j.user;auth.csrf=j.csrf}else markOut()}
 catch(e){auth.state='out';auth.user=null;auth.csrf=null}
 renderAuthNav()}
function renderAuthNav(){const el=$('#authnav');if(!el)return;
 el.innerHTML=auth.state==='in'?'<span class="note hide">'+esc(auth.user.email)+'</span><button class="btn ghost sm" data-logout>Log out</button>':(srv.state==='down'||srv.state==='unconfigured'?'':'<a href="#/login" style="color:var(--mute)">Log in</a><a class="btn ghost sm" href="#/register">Sign up</a>')}
async function doLogout(){
 if(saver&&saver.isPending()&&!confirm('Some changes are not saved yet. Log out anyway? They stay in a recovery copy in this browser until you log in again.'))return;
 try{await api('POST','/api/auth/logout',{})}catch(e){if(!e.auth){toast('Could not log out: '+e.message);return}}
 markOut();draft=null;rows=[];auth.next=null;auth.reason='';toast('Logged out');location.hash='#/'}
async function authRoute(m){await checkServer();if(auth.state==='in'){location.hash=auth.next||'#/dashboard';return}authPage(m)}
function authPage(mode){const reg=mode==='register';const off=srv.state!=='ready';
 app.innerHTML=`<div class="wrap" style="max-width:440px;padding:56px 20px 70px"><h1 style="font-size:30px;margin:0 0 6px">${reg?'Create your account':'Log in'}</h1>
<p class="note" role="status">${off?(srv.state==='unconfigured'?'Accounts are not available: server storage is not configured.':'The server is not reachable right now ('+esc(srv.msg||'try again soon')+'). Local-only projects still work from the dashboard.'):esc(auth.reason||'Projects are saved to your account.')}</p>
<div class="card f"><label for="em">Email</label><input id="em" type="email" autocomplete="email" maxlength="254"><label for="pw">Password</label><input id="pw" type="password" autocomplete="${reg?'new-password':'current-password'}" maxlength="128">${reg?'<p class="note" style="margin:6px 0 0">At least 10 characters.</p>':''}<div class="err" id="auth_err" role="alert"></div><p style="margin:16px 0 0"><button class="btn" id="auth_go" style="width:100%" ${off?'disabled':''}>${reg?'Create account':'Log in'}</button></p></div>
<p class="note" style="margin-top:14px">${reg?'Already have an account? <a href="#/login" style="text-decoration:underline">Log in</a>':'New here? <a href="#/register" style="text-decoration:underline">Create an account</a>'}</p></div>`;
 const go=async()=>{const em=$('#em').value.trim(),pw=$('#pw').value,err=$('#auth_err'),b=$('#auth_go');err.textContent='';
  if(!em||!pw){err.textContent='Enter your email and password.';return}
  b.disabled=true;b.textContent=reg?'Creating…':'Logging in…';
  try{const j=await apiRaw('POST','/api/auth/'+(reg?'register':'login'),{email:em,password:pw});$('#pw').value='';auth.state='in';auth.user=j.user;auth.csrf=j.csrf;auth.reason='';renderAuthNav();const t=auth.next||'#/dashboard';auth.next=null;location.hash=t}
  catch(e){err.textContent=e.message;b.disabled=false;b.textContent=reg?'Create account':'Log in'}};
 $('#auth_go').onclick=go;['#em','#pw'].forEach(x=>$(x).addEventListener('keydown',e=>{if(e.key==='Enter')go()}));$('#em').focus()}
async function legacyBanner(){const t=legacyToken();if(!t||auth.state!=='in'||srv.state!=='ready')return;
 try{const j=await api('POST','/api/auth/legacy/preview',{token:t});const b=$('#dban');if(!b||!j.count)return;
  b.insertAdjacentHTML('beforeend','<div class="msg"><b>'+j.count+' project'+(j.count>1?'s':'')+' from before accounts</b> ('+esc(j.projects.map(p=>p.name).join(', '))+') '+(j.count>1?'were':'was')+' found for this browser. <button class="btn sm" data-claim>Add to my account</button><div class="note" style="margin-top:6px">Only do this if they are your projects. They will belong to '+esc(auth.user.email)+'.</div></div>')}catch(e){}}
async function doClaim(){const t=legacyToken();if(!t)return;
 try{const j=await api('POST','/api/auth/legacy/claim',{token:t});try{localStorage.removeItem(OKEY)}catch(e){}toast(j.claimed+' project'+(j.claimed===1?'':'s')+' added to your account');await loadRows()}
 catch(e){toast('Could not add them: '+e.message)}}
async function checkServer(force){
 if(!force&&srv.state==='ready')return;
 if(!force&&srv.state!=='unknown'&&Date.now()-srv.at<10000)return;
 srv.at=Date.now();
 try{const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);const r=await fetch(apiBase()+'/api/health',{signal:c.signal});clearTimeout(t);const j=await r.json();const d=j&&j.database;
  srv.state=d==='connected'?'ready':(d==='unavailable'||d==='needs_migration')?'down':'unconfigured';srv.msg=d==='unavailable'?'the database is not reachable':d==='needs_migration'?'a database update is pending':''}
 catch(e){srv.state='down';srv.msg='the backend is not reachable (it may be waking up)'}
 if(srv.state==='ready')await checkAuth(force)}
/* LOCALSTORE-START */
const RKEY='launchforge.recovery.v1', IKEY='launchforge.imported.v1';
function jget(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v&&typeof v==='object'&&!Array.isArray(v)?v:d}catch(e){return d}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
const importedMap=uid=>{const m=jget(IKEY,{})[uid];return m&&typeof m==='object'&&!Array.isArray(m)?m:{}};
function setImported(uid,map){const all=jget(IKEY,{});all[uid]=map;return jset(IKEY,all)}
function recoveryRead(key){const e=jget(RKEY,{})[key];return e&&typeof e==='object'&&e.payload?e:null}
function recoveryWrite(key,val){const r=jget(RKEY,{});r[key]=val;return jset(RKEY,r)}
function recoveryClear(key){const r=jget(RKEY,{});if(key in r){delete r[key];jset(RKEY,r)}}
function sameContent(a,b){return['name','type','desc','audience','style','html'].every(k=>(a[k]||'')===(b[k]||''))&&JSON.stringify(a.pages||[])===JSON.stringify(b.pages||[])}
function importItem(p){return{localId:p.id,name:p.name,type:p.type,desc:p.desc,audience:p.audience,style:p.style,pages:p.pages,html:p.html||'',mode:p.mode||null,generatedAt:p.generatedAt||null,created:p.created||null,history:Array.isArray(p.history)?p.history.slice(-5):[]}}
// Copies local projects to the server. Never changes or deletes local data. post(item) -> {status,id,message}.
async function runImport(items,post,uid){
 const map=importedMap(uid),ok=[],bad=[];
 for(const p of items){
  if(map[p.id])continue;
  try{const r=await post(importItem(p));
   if(r&&(r.status==='imported'||r.status==='exists')){map[p.id]=r.id;setImported(uid,map);ok.push(p.id)}
   else bad.push({id:p.id,name:p.name,message:(r&&r.message)||'not imported'})}
  catch(e){bad.push({id:p.id,name:p.name,message:e.message});if(e.network||e.status>=500||e.status===429)break}}
 return{ok,bad}}
/* LOCALSTORE-END */
/* SAVER-START */
function createSaver(o){
 const T=o.timers||{set:(f,m)=>setTimeout(f,m),clear:t=>clearTimeout(t)};
 const delay=o.delay==null?2000:o.delay,backoff=o.backoff||[3000,10000,30000];
 let state='saved',dirty=false,running=false,timer=null,tries=0,latest=null,lastErr=null;
 const set=(s,e)=>{state=s;lastErr=e||null;if(o.onState)o.onState(s,e||null)};
 const sched=ms=>{T.clear(timer);timer=T.set(()=>{run()},ms)};
 function touch(snap){latest=snap;dirty=true;tries=0;if(state==='conflict'||running)return;set('dirty');sched(delay)}
 async function run(){
  if(running||!dirty)return;T.clear(timer);running=true;dirty=false;const snap=latest;set('saving');
  try{await o.save(snap);running=false;if(dirty){set('dirty');sched(0)}else set('saved')}
  catch(e){running=false;dirty=true;
   if(e&&e.conflict){set('conflict',e);return}
   set('failed',e);
   if(!(e&&e.fatal)&&tries<backoff.length)sched(backoff[tries++])}}
 async function flush(){
  if(state==='conflict'||state==='failed'){tries=0;if(state==='conflict')set('dirty')}
  for(let i=0;i<400;i++){
   if(running){await new Promise(r=>T.set(r,10));continue}
   if(!dirty)break;
   await run();if(state==='failed'||state==='conflict')break}
  return state}
 return{touch,flush,state:()=>state,error:()=>lastErr,isPending:()=>dirty||running||state==='failed'||state==='conflict'}}
/* SAVER-END */
function makeSnap(){if($('#n'))read();return{me:cur,name:cur.name,type:cur.type,desc:cur.desc,audience:cur.audience,style:cur.style,pages:cur.pages.slice(),html:draft?draft.html:(cur.html||''),mode:draft?draft.mode:(cur.mode||null),generatedAt:draft?draft.at:(cur.generatedAt||null),history:(cur.history||[]).slice(-5)}}
function touchSave(){if(!saver)return;const s=makeSnap();const payload=Object.assign({},s);delete payload.me;recoveryWrite(uk(s.me.id||'new'),{payload,baseVersion:s.me.version||0,at:Date.now()});saver.touch(s)}
async function pushServer(snap){
 const me=snap.me;
 const body={name:snap.name,type:snap.type,desc:snap.desc,audience:snap.audience,style:snap.style,pages:snap.pages,html:snap.html,mode:snap.mode,generatedAt:snap.generatedAt,history:snap.history};
 if(!body.name){const e=new Error('Add a project name to save.');e.fatal=true;throw e}
 try{
  let r;
  if(!me.id){r=await api('POST','/api/projects',body);me.id=r.project.id;if(cur===me&&location.hash.indexOf(me.id)<0)history.replaceState(null,'','#/project/'+me.id)}
  else r=await api('PUT','/api/projects/'+me.id,Object.assign({baseVersion:me.version},body));
  me.version=r.project.version;me.created=r.project.created;me.src='server';
  if(cur===me&&draft&&draft.html===snap.html)draft.saved=true;
  if(cur===me)stateBox();
 }catch(e){if(e.status===409&&e.code==='VERSION_CONFLICT'){e.conflict=true;e.current=e.data&&e.data.current}throw e}}
function initSaver(){

 aiBusy=false;cur.history=Array.isArray(cur.history)?cur.history.filter(h=>h&&typeof h.instruction==='string'&&typeof h.prev==='string'):[];const saved=p&&p.html;draft=saved?{html:p.html,at:p.generatedAt,mode:p.mode,saved:true}:null;
 const pg=['Services','Pricing','Gallery','Blog'];
 app.innerHTML=`<div class="wrap"><div class="ws"><div class="card f"><h2 style="margin:0 0 4px">${id?'Project settings':'Describe your business'}</h2><p class="note" style="margin:0">Mode: <b>Demonstration (templates)</b>. AI generation is not configured.</p>
 <label for="n">Project name</label><input id="n" value="${esc(cur.name)}" maxlength="60"><div class="err" id="e_n"></div>
 <div class="two"><div><label for="t">Business type</label><select id="t">${[['cafe','Café'],['consulting','Consulting'],['portfolio','Portfolio'],['restaurant','Restaurant'],['fitness','Fitness studio'],['other','Other']].map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select></div>

 <label for="d">Business description</label><textarea id="d" rows="4" maxlength="500">${esc(cur.desc)}</textarea><div class="err" id="e_d"></div>
 <label for="a">Target audience</label><input id="a" value="${esc(cur.audience)}" maxlength="120">
 <label>Pages and features</label><div style="display:flex;gap:12px;flex-wrap:wrap">${pg.map(x=>`<label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto" class="pgc" value="${x}" ${cur.pages.includes(x)?'checked':''}>${x}</label>`).join('')}</div>
 <p style="margin:18px 0 0"><button class="btn" id="gen" style="width:100%">Generate Website</button></p>
 <div class="info" id="state"></div>${aiPanel()}</div>
 <div class="pv"><div class="pvh"><a class="btn ghost sm" id="bk" href="#/dashboard">&larr; Projects</a><b style="margin-right:auto">Preview</b><span id="savest" class="badge" role="status" aria-live="polite"></span><button class="btn ghost sm" id="vd">Desktop</button><button class="btn ghost sm" id="vm">Mobile</button><button class="btn ghost sm" id="sv">Save project</button><button class="btn ghost sm" id="ex">Export HTML</button><button class="btn ghost sm" id="dp">Deploy</button></div><div class="pvb" id="pvb"></div></div></div></div>`;
 $('#t').value=cur.type;$('#st').value=cur.style;
 $('#gen').onclick=generate;$('#vd').onclick=()=>setView(false);$('#vm').onclick=()=>setView(true);$('#sv').onclick=saveProj;$('#ex').onclick=exportHtml;$('#dp').onclick=deployInfo;
 mobile=false;initSaver();showPv();stateBox();aiInit();bindForm();recoveryPrompt();

  $('#lv').onclick=()=>{closeM();draft=null;location.hash='#/dashboard'};$('#sl').onclick=()=>{saveProj();if(draft&&draft.saved){closeM();location.hash='#/dashboard'}else closeM()}}}}
function read(){cur.name=$('#n').value.trim();cur.type=$('#t').value;cur.style=$('#st').value;cur.desc=$('#d').value.trim();cur.audience=$('#a').value.trim();cur.pages=[...document.querySelectorAll('.pgc:checked')].map(x=>x.value)}
function paint(){}

function saveProj(){read();if(!cur.name){$('#e_n').textContent='Enter a project name.';return}

function exportHtml(){if(!draft){toast('Generate a website first.');return}read();const n=(cur.name||'website').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'website';

const EX=['Make it look more premium and luxurious','Change the colour scheme to black and gold','Add a testimonials section','Make the hero section more modern','Rewrite the text to sound more professional','Add a pricing section with three plans'];
function aiPanel(){return `<div class="ai" id="ai"><h3 style="margin:0 0 4px;font-size:17px">Change anything with AI</h3><p class="note" style="margin:0 0 8px">Describe a change and the AI rewrites the website. The preview updates immediately. Server-saved projects autosave; local-only projects need Save project and stay in this browser only.</p><div id="aist"></div>
<label for="ai_p">Your instruction</label><textarea id="ai_p" rows="3" maxlength="1000" placeholder="e.g. Add a testimonials section"></textarea>
<div class="chips">${EX.map(x=>`<button type="button" class="chip" data-ex="${esc(x)}">${esc(x)}</button>`).join('')}</div>
<div id="aimsg" role="status" aria-live="polite"></div>
<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn" id="ai_go">Apply Changes</button><button class="btn ghost" id="ai_undo">Undo last edit</button></div><div id="aih"></div>
<details style="margin-top:14px"><summary class="note">Backend settings</summary><label for="ai_url">AI backend URL</label><div style="display:flex;gap:8px"><input id="ai_url" placeholder="https://your-backend.example.com"><button class="btn ghost sm" id="ai_us" type="button">Use</button></div><p class="note">Enter a URL only. Never paste an API key here; the key belongs in the server's environment variables.</p></details></div>`}

function aiRender(){const st=$('#aist');if(!st)return;
 const m={checking:['','Checking AI backend…'],ready:['ok','AI backend connected'],noconfig:['warn','Backend is running but the Gemini API key is not configured.'],down:['warn','AI backend not reachable at '+(apiBase()||'this site')+'. Start it with npm start (see README)']}[aiStatus];
 st.innerHTML=auth.state!=='in'?'<span class="badge warn">Log in to use AI editing</span> <a href="#/login" style="text-decoration:underline">Log in</a>':'<span class="badge '+m[0]+'">'+esc(m[1])+'</span>';

async function health(){aiStatus='checking';aiRender();try{const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);const r=await fetch(apiBase()+'/api/health',{signal:c.signal});clearTimeout(t);const j=await r.json();aiStatus=j&&j.aiConfigured?'ready':'noconfig'}catch(e){aiStatus='down'}aiRender()}

async function applyEdit(){

  const r=await fetch(apiBase()+'/api/edit',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','X-CSRF-Token':auth.csrf||''},signal:c.signal,body:JSON.stringify({html:draft.html,instruction:ins,projectId:cur.src==='server'&&cur.id?cur.id:undefined,context:{name:cur.name,type:cur.type,style:cur.style}})});

}
