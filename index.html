<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LaunchForge</title>
<style>
:root{--bg:#0d0b14;--panel:#171422;--panel2:#1f1b2e;--line:#2c2740;--text:#ece9f6;--mute:#9c96b4;--v:#8b5cf6;--v2:#6d3fe0;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 "Segoe UI",system-ui,sans-serif}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(13,11,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;align-items:center;gap:20px;height:60px}
.logo{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--v),#c4b5fd);display:inline-block}
.links{display:flex;gap:18px;margin-left:auto;align-items:center;color:var(--mute)}
.links a,.links button.l{background:none;border:0;cursor:pointer;color:var(--mute);padding:4px}
.links a:hover,.links button.l:hover{color:var(--text)}
.btn{background:var(--v);border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600;color:#fff;transition:background .15s}
.btn:hover{background:var(--v2)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.btn.ghost:hover{background:var(--panel2)}
.btn.danger{background:#b91c1c}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.sm{padding:6px 12px;font-size:14px}
.hero{padding:84px 0 40px;text-align:center}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.08;margin:0 0 18px;letter-spacing:-.02em}
.hero p{max-width:600px;margin:0 auto 28px;color:var(--mute);font-size:18px}
.hero .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.mock{margin:48px auto 0;max-width:900px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.mock .bar{display:flex;gap:6px;margin-bottom:14px}.mock .bar b{width:10px;height:10px;border-radius:50%;background:var(--line)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mc{background:var(--panel2);border-radius:12px;padding:14px;font-size:14px}.mc small{color:var(--mute)}
section.s{padding:72px 0}section.s h2{font-size:32px;margin:0 0 10px;letter-spacing:-.01em}.sub{color:var(--mute);margin:0 0 32px;max-width:620px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.card h3{margin:0 0 6px;font-size:18px}.card p{margin:0;color:var(--mute)}
.plan.hl{border-color:var(--v)}.plan .price{font-size:28px;font-weight:700;margin:6px 0}.plan ul{padding-left:18px;color:var(--mute);margin:12px 0}
.note{font-size:13px;color:var(--mute)}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px}summary{cursor:pointer;font-weight:600}details p{color:var(--mute);margin:10px 0 0}
footer{border-top:1px solid var(--line);padding:32px 0;color:var(--mute)}footer .wrap{display:flex;gap:20px;flex-wrap:wrap;align-items:center}footer .sp{margin-left:auto}
.bar2{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.bar2 input,.bar2 select,.f input,.f select,.f textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.bar2 input{flex:1;min-width:180px;width:auto}.bar2 select{width:auto}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--v);outline-offset:1px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.badge.ok{color:var(--ok);border-color:#1f5a35}.badge.warn{color:var(--warn);border-color:#6b5316}
.empty{text-align:center;padding:60px 20px;border:1px dashed var(--line);border-radius:14px;color:var(--mute)}
.f label{display:block;font-size:14px;color:var(--mute);margin:14px 0 5px}.f .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.err{color:var(--err);font-size:13px;margin-top:4px}
.ws{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start;padding:24px 0}
.pv{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:500px;display:flex;flex-direction:column}
.pvh{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pvb{flex:1;background:#2a2740;display:flex;justify-content:center;padding:12px;min-height:560px}
.pvb iframe{border:0;background:#fff;height:620px;max-width:100%;width:100%;border-radius:8px}
.pvb.m iframe{width:390px}
.ph{margin:auto;color:var(--mute);text-align:center;padding:20px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--v);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}.modal .card{max-width:420px;width:100%}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--v);padding:10px 18px;border-radius:10px;z-index:30}
.info{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--mute);margin-top:14px}
.info b{color:var(--text)}
@media(max-width:860px){.ws{grid-template-columns:1fr}.mgrid{grid-template-columns:1fr}.links .hide{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ai{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;color:var(--mute);cursor:pointer}.chip:hover{color:var(--text);border-color:var(--v)}
.msg{margin-top:10px;padding:9px 12px;border-radius:10px;font-size:14px;background:var(--panel2)}.msg.ok{color:var(--ok)}.msg.err{color:var(--err)}
.hist{margin:0;padding-left:18px;font-size:14px;color:var(--mute)}
/* ---- sign in / create account ---- */
.au{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:calc(100vh - 61px)}
.au-side{position:relative;overflow:hidden;padding:72px 56px;background:radial-gradient(900px 520px at 8% 0%,rgba(139,92,246,.34),transparent 62%),radial-gradient(700px 420px at 100% 100%,rgba(109,63,224,.24),transparent 60%),#100d1b;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.au-side h2{font-size:clamp(30px,3.4vw,46px);line-height:1.08;letter-spacing:-.02em;margin:0 0 14px;max-width:520px}
.au-side p{color:var(--mute);max-width:470px;margin:0 0 30px;font-size:17px}
.au-pts{list-style:none;padding:0;margin:0;display:grid;gap:16px;max-width:470px}
.au-pts li{display:flex;gap:12px;align-items:flex-start}.au-pts svg{flex:none;margin-top:2px;color:#a78bfa}
.au-main{display:flex;align-items:center;justify-content:center;padding:48px 20px}
.au-card{width:100%;max-width:420px}
.au-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 24px}
.au-tabs a{text-align:center;padding:9px 10px;border-radius:9px;color:var(--mute);font-weight:600;font-size:15px;transition:background .15s,color .15s}
.au-tabs a:hover{color:var(--text)}.au-tabs a[aria-current=page]{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px var(--line) inset}
.au-tabs a:focus-visible{outline:2px solid var(--v);outline-offset:1px}
.au h1{font-size:28px;line-height:1.2;letter-spacing:-.01em;margin:0 0 6px}.au-sub{color:var(--mute);margin:0 0 22px}
.au-status{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:10px 12px;font-size:14px;color:var(--mute);margin:0 0 16px}
.au-status.warn{border-color:#6b5316;color:var(--warn)}
.au-social{display:grid;gap:10px}
.au-sb{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 16px;border-radius:11px;border:1px solid var(--line);font-weight:600;font-size:15px;cursor:pointer;text-align:left;transition:transform .08s,box-shadow .15s,border-color .15s}
.au-sb svg{flex:none;width:20px;height:20px}.au-sb .t{flex:1}.au-sb small{font-weight:500;font-size:12px;opacity:.8}
.au-sb.google{background:#fff;color:#1f1f1f;border-color:#dadce0}.au-sb.github{background:#24292f;color:#fff;border-color:#3d444d}.au-sb.apple{background:#fff;color:#000;border-color:#dadce0}
.au-sb:hover:not([aria-disabled=true]){transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.au-sb[aria-disabled=true]{opacity:.55;cursor:not-allowed}
.au-sb:focus-visible{outline:2px solid #c4b5fd;outline-offset:2px}
.au-or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px;margin:20px 0}.au-or:before,.au-or:after{content:"";flex:1;height:1px;background:var(--line)}
.au-field{margin-bottom:14px}.au-field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.au-in{position:relative}
.au-in input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;min-height:46px;transition:border-color .15s,box-shadow .15s}
.au-in input:hover{border-color:#40395c}.au-in input:focus{outline:none;border-color:var(--v);box-shadow:0 0 0 3px rgba(139,92,246,.28)}
.au-in input[aria-invalid=true]{border-color:var(--err)}.au-in input.pw{padding-right:50px}
.au-eye{position:absolute;right:4px;top:4px;width:38px;height:38px;border:0;background:none;color:var(--mute);border-radius:8px;cursor:pointer;display:grid;place-items:center}
.au-eye:hover{color:var(--text);background:var(--panel2)}
.au-hint{font-size:13px;color:var(--mute);margin-top:6px}.au-fe{font-size:13px;color:var(--err);margin-top:6px}.au-fe:empty{display:none}
.au-alert{border:1px solid #6e2b2b;background:rgba(248,113,113,.09);color:#fecaca;border-radius:11px;padding:10px 12px;font-size:14px;margin:0 0 14px}.au-alert:empty{display:none}.au-social+.au-alert{margin:12px 0 0}
.au-submit{width:100%;min-height:48px;border-radius:11px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.au-spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.au-legal{font-size:13px;color:var(--mute);margin:18px 0 0;text-align:center}.au-legal a{text-decoration:underline}
.links a,.links button,#authnav a,#authnav button{white-space:nowrap}
@media(max-width:560px){nav.top .wrap{gap:12px}.links{gap:12px}#authnav a.btn{display:none}}
@media(max-width:880px){.au{grid-template-columns:1fr;min-height:0}.au-side{display:none}.au-main{padding:28px 18px 56px;align-items:flex-start}}

const NAVJS='<script>document.addEventListener("click",function(ev){var a=ev.target.closest&&ev.target.closest("a");if(!a)return;var h=a.getAttribute("href")||"";ev.preventDefault();if(h.charAt(0)==="#"){var el=document.getElementById(h.slice(1));if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}});<\/script>';

const OKEY='launchforge.owner.v1';

const auth={state:'unknown',user:null,csrf:null,next:null,reason:''};   // state: unknown | in | out

/* XSITE-START */

async function apiRaw(method,path,body,timeout){

function providerView(name,info,serverOff){

 aiBusy=false;cur.history=Array.isArray(cur.history)?cur.history.filter(h=>h&&typeof h.instruction==='string'&&typeof h.prev==='string'):[];const saved=p&&p.html;draft=saved?{html:p.html,at:p.generatedAt,mode:p.mode,saved:true}:null;
 const pg=['Services','Pricing','Gallery','Blog'];
 app.innerHTML=`<div class="wrap"><div class="ws"><div class="card f"><h2 style="margin:0 0 4px">${id?'Project settings':'Describe your business'}</h2><p class="note" style="margin:0">Mode: <b>Demonstration (templates)</b>. AI generation is not configured.</p>
 <label for="n">Project name</label><input id="n" value="${esc(cur.name)}" maxlength="60"><div class="err" id="e_n"></div>
 <div class="two"><div><label for="t">Business type</label><select id="t">${[['cafe','Café'],['consulting','Consulting'],['portfolio','Portfolio'],['restaurant','Restaurant'],['fitness','Fitness studio'],['other','Other']].map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select></div>
 <div><label for="st">Visual style</label><select id="st">${['Modern','Minimal','Elegant','Playful','Dark'].map(s=>`<option>${s}</option>`).join('')}</select></div></div>
 <label for="d">Business description</label><textarea id="d" rows="4" maxlength="500">${esc(cur.desc)}</textarea><div class="err" id="e_d"></div>
 <label for="a">Target audience</label><input id="a" value="${esc(cur.audience)}" maxlength="120">
 <label>Pages and features</label><div style="display:flex;gap:12px;flex-wrap:wrap">${pg.map(x=>`<label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto" class="pgc" value="${x}" ${cur.pages.includes(x)?'checked':''}>${x}</label>`).join('')}</div>
 <p style="margin:18px 0 0"><button class="btn" id="gen" style="width:100%">Generate Website</button></p>
 <div class="info" id="state"></div>${aiPanel()}</div>
 <div class="pv"><div class="pvh"><a class="btn ghost sm" id="bk" href="#/dashboard">&larr; Projects</a><b style="margin-right:auto">Preview</b><span id="savest" class="badge" role="status" aria-live="polite"></span><button class="btn ghost sm" id="vd">Desktop</button><button class="btn ghost sm" id="vm">Mobile</button><button class="btn ghost sm" id="sv">Save project</button><button class="btn ghost sm" id="ex">Export HTML</button><button class="btn ghost sm" id="dp">Deploy</button></div><div class="pvb" id="pvb"></div></div></div></div>`;
 $('#t').value=cur.type;$('#st').value=cur.style;
 $('#gen').onclick=generate;$('#vd').onclick=()=>setView(false);$('#vm').onclick=()=>setView(true);$('#sv').onclick=saveProj;$('#ex').onclick=exportHtml;$('#dp').onclick=deployInfo;
 mobile=false;initSaver();showPv();stateBox();aiInit();bindForm();recoveryPrompt();
 $('#bk').onclick=e=>{if(saver&&saver.isPending()){e.preventDefault();leaveServer();return}if(draft&&!draft.saved){e.preventDefault();modal('<h3>Unsaved changes</h3><p class="note">The current preview has changes that are not saved to this project.</p><div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px"><button class="btn ghost sm" data-x>Stay</button><button class="btn ghost sm" id="lv">Leave without saving</button><button class="btn sm" id="sl">Save and leave</button></div>');
  $('#lv').onclick=()=>{closeM();draft=null;location.hash='#/dashboard'};$('#sl').onclick=()=>{saveProj();if(draft&&draft.saved){closeM();location.hash='#/dashboard'}else closeM()}}}}
function read(){cur.name=$('#n').value.trim();cur.type=$('#t').value;cur.style=$('#st').value;cur.desc=$('#d').value.trim();cur.audience=$('#a').value.trim();cur.pages=[...document.querySelectorAll('.pgc:checked')].map(x=>x.value)}
function paint(){}
function showPv(){const b=$('#pvb');if(!b)return;b.className='pvb'+(mobile?' m':'');
 if(!draft){b.innerHTML='<div class="ph">No website yet.<br>Fill in the form and click <b>Generate Website</b>.</div>';return}
 b.innerHTML='';const f=document.createElement('iframe');f.title='Generated website preview';f.setAttribute('sandbox','allow-scripts allow-forms');f.srcdoc=draft.html;b.appendChild(f)}
function setView(m){mobile=m;const b=$('#pvb');b&&b.classList.toggle('m',m)}
function stateBox(){stateBox0();aiRender()}
function stateBox0(){const s=$('#state');if(!s)return;
 const where=cur.src==='server'?'<span class="badge ok">Saved on server</span>':'<span class="badge warn">Local only · this browser</span>';
 s.innerHTML=draft?`<b>Preview:</b> ${draft.saved?'<span class="badge ok">matches saved project</span>':'<span class="badge warn">unsaved changes</span>'}<br>Updated ${new Date(draft.at).toLocaleString()} · ${draft.mode==='demo'?'demonstration template (not AI)':'edited with AI'}${cur.history.length?' · '+cur.history.length+' edit(s)':''}<br><b>Project:</b> ${cur.id?where:(cur.src==='server'?'not saved yet (will autosave)':'not saved yet (local only)')}`:'<b>Preview:</b> empty<br><b>Project:</b> '+(cur.id?where:'not saved yet');
 saveBadge()}
function validate(){let ok=true;$('#e_n').textContent='';$('#e_d').textContent='';
 if(!cur.name){$('#e_n').textContent='Enter a project name.';ok=false}
 if(cur.desc.length<20){$('#e_d').textContent='Describe your business in at least 20 characters.';ok=false}return ok}
function generate(){read();if(!validate())return;if(aiBusy){toast('Wait for the AI edit to finish.');return}if((cur.history.length||(saver&&draft&&cur.id))&&!confirm('Regenerating replaces the current website'+(saver?' and autosaves the new version over the saved one':' in the preview')+'. Continue?'))return;const b=$('#gen');b.disabled=true;b.textContent='Generating…';
 $('#pvb').innerHTML='<div class="ph"><div class="spin"></div>Building your website…</div>';
 setTimeout(()=>{try{const html=buildSite(cur);draft={html,at:Date.now(),mode:'demo',saved:false};cur.history=[];showPv();touchSave()}catch(e){$('#pvb').innerHTML='<div class="ph">Generation failed: '+esc(e.message)+'<br>Try again.</div>'}
  b.disabled=false;b.textContent=draft?'Regenerate Website':'Generate Website';stateBox();toast(aiConfigured?'Generated':'Generated in demonstration mode (template, not AI)')},500)}
function saveProj(){read();if(!cur.name){$('#e_n').textContent='Enter a project name.';return}
 if(saver){touchSave();saver.flush();return}
 const l=load();const rec={...cur,id:cur.id||('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),created:cur.created||Date.now()};
 delete rec.src;delete rec.version;if(draft){rec.html=draft.html;rec.generatedAt=draft.at;rec.mode=draft.mode}rec.history=(cur.history||[]).slice(-10);
 const i=l.findIndex(x=>x.id===rec.id);i>=0?l[i]=rec:l.push(rec);
 if(!save(l))return;cur=rec;if(draft)draft.saved=true;stateBox();toast('Project saved');if(location.hash.indexOf(rec.id)<0)history.replaceState(null,'','#/project/'+rec.id)}
function exportHtml(){if(!draft){toast('Generate a website first.');return}read();const n=(cur.name||'website').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'website';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([draft.html],{type:'text/html'}));a.download=n+'.html';document.body.appendChild(a);a.click();a.remove();toast('Downloaded '+n+'.html')}
function deployInfo(){modal(`<h3>Deployment is not connected</h3><p class="note">Nothing has been deployed. To publish this site now: use Export HTML, then upload the file to a static host (Netlify Drop, Cloudflare Pages, GitHub Pages).</p><p class="note">To add one-click deploy, LaunchForge needs a server with provider credentials (for example a Netlify or Vercel API token) kept in environment variables, never in browser code.</p><div style="text-align:right;margin-top:12px"><button class="btn sm" data-x>Close</button></div>`)}
/* ---------- AI editor ---------- */
const EX=['Make it look more premium and luxurious','Change the colour scheme to black and gold','Add a testimonials section','Make the hero section more modern','Rewrite the text to sound more professional','Add a pricing section with three plans'];
function aiPanel(){return `<div class="ai" id="ai"><h3 style="margin:0 0 4px;font-size:17px">Change anything with AI</h3><p class="note" style="margin:0 0 8px">Describe a change and the AI rewrites the website. The preview updates immediately. Server-saved projects autosave; local-only projects need Save project and stay in this browser only.</p><div id="aist"></div>
<label for="ai_p">Your instruction</label><textarea id="ai_p" rows="3" maxlength="1000" placeholder="e.g. Add a testimonials section"></textarea>
<div class="chips">${EX.map(x=>`<button type="button" class="chip" data-ex="${esc(x)}">${esc(x)}</button>`).join('')}</div>
<div id="aimsg" role="status" aria-live="polite"></div>
<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn" id="ai_go">Apply Changes</button><button class="btn ghost" id="ai_undo">Undo last edit</button></div><div id="aih"></div>
<details style="margin-top:14px"><summary class="note">Backend settings</summary><label for="ai_url">AI backend URL</label><div style="display:flex;gap:8px"><input id="ai_url" placeholder="https://your-backend.example.com"><button class="btn ghost sm" id="ai_us" type="button">Use</button></div><p class="note">Enter a URL only. Never paste an API key here; the key belongs in the server's environment variables.</p></details></div>`}
function aiMsg(k,t){const m=$('#aimsg');if(m)m.innerHTML='<div class="msg '+k+'">'+esc(t)+'</div>'}
function aiRender(){const st=$('#aist');if(!st)return;
 const m={checking:['','Checking AI backend…'],ready:['ok','AI backend connected'],noconfig:['warn','Backend is running but the Gemini API key is not configured.'],down:['warn','AI backend not reachable at '+(apiBase()||'this site')+'. Start it with npm start (see README)']}[aiStatus];
 st.innerHTML=auth.state!=='in'?'<span class="badge warn">Log in to use AI editing</span> <a href="#/login" style="text-decoration:underline">Log in</a>':'<span class="badge '+m[0]+'">'+esc(m[1])+'</span>';
 $('#ai_go').disabled=aiBusy||!draft||auth.state!=='in';$('#ai_go').textContent=aiBusy?'Applying…':'Apply Changes';$('#ai_p').disabled=aiBusy;$('#ai_undo').disabled=aiBusy||!cur.history.length;
 $('#aih').innerHTML=cur.history.length?'<p class="note" style="margin:12px 0 4px">Edit history (newest first)</p><ol class="hist" reversed>'+cur.history.slice().reverse().map(h=>'<li>'+esc(h.instruction)+' <span class="note">'+new Date(h.at).toLocaleTimeString()+'</span></li>').join('')+'</ol>':'';
 if(!draft&&!aiBusy&&!$('#aimsg').textContent)aiMsg('','Generate a website first to enable AI editing.')}
async function health(){aiStatus='checking';aiRender();try{const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);const r=await fetch(apiBase()+'/api/health',{signal:c.signal});clearTimeout(t);const j=await r.json();aiStatus=j&&j.aiConfigured?'ready':'noconfig'}catch(e){aiStatus='down'}aiRender()}
function aiInit(){document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{$('#ai_p').value=b.dataset.ex;$('#ai_p').focus()});
 $('#ai_go').onclick=applyEdit;$('#ai_undo').onclick=undoEdit;$('#ai_url').value=localStorage.getItem('launchforge.apiBase')||'';
 $('#ai_us').onclick=()=>{const v=$('#ai_url').value.trim();if(v&&!/^https?:\/\//i.test(v)){aiMsg('err','Enter a full URL starting with http:// or https://');return}v?localStorage.setItem('launchforge.apiBase',v):localStorage.removeItem('launchforge.apiBase');health()};health()}
async function applyEdit(){
 const ins=$('#ai_p').value.trim();
 if(!draft)return aiMsg('err','Generate a website first.');
 if(!ins)return aiMsg('err','Enter an instruction describing what to change.');
 read();const me=cur;aiBusy=true;aiMsg('','The AI is editing your website. This can take up to a minute…');aiRender();
 const c=new AbortController(),to=setTimeout(()=>c.abort(),110000);
 try{
  const r=await fetch(apiBase()+'/api/edit',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','X-CSRF-Token':auth.csrf||''},signal:c.signal,body:JSON.stringify({html:draft.html,instruction:ins,projectId:cur.src==='server'&&cur.id?cur.id:undefined,context:{name:cur.name,type:cur.type,style:cur.style}})});
  if(r.status===401){markOut();auth.reason='Your session expired. Log in again.';throw new Error('Your session expired. Log in again to use AI editing.')}
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok||!j||typeof j.html!=='string'){throw new Error((j&&j.error&&j.error.message)||(r.status===404?'No AI backend was found at this address. Start it or set its URL under Backend settings.':'The server returned an unexpected response (HTTP '+r.status+').'))}
  if(cur!==me)return;
  let h=j.html;if(!/<\/html>\s*$/i.test(h.trim()))throw new Error('The AI returned an incomplete page.');
  if(h.indexOf('scrollIntoView')<0)h=h.replace(/<\/body>/i,NAVJS+'</body>');
  cur.history.push({id:Date.now(),instruction:ins,at:Date.now(),prev:draft.html});cur.history=cur.history.slice(cur.src==='server'?-5:-10);
  draft={html:h,at:Date.now(),mode:'ai',saved:false};showPv();$('#ai_p').value='';touchSave();aiMsg('ok',saver?'Changes applied. Autosaving to the server…':'Changes applied. The preview is updated but not saved yet. Click Save project to keep it.');
 }catch(e){if(cur===me){const net=e.name==='TypeError'?'Could not reach the AI backend (network error). ':e.name==='AbortError'?'The request timed out. ':'';aiMsg('err',net+(net?'':e.message+' ')+'Your website was not changed.')}}
 finally{clearTimeout(to);if(cur===me){aiBusy=false;stateBox()}}
}
function undoEdit(){if(!cur.history.length||aiBusy)return;const h=cur.history.pop();draft={html:h.prev,at:Date.now(),mode:cur.history.length?'ai':'demo',saved:false};showPv();touchSave();aiMsg('ok','Undid: "'+h.instruction+'".'+(saver?' Autosaving…':' The preview is unsaved.'));stateBox()}
checkServer().then(renderAuthNav);
route();
